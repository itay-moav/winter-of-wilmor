<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter of Velmoor</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app">
  <div id="top">
    <div id="viewWrap">
      <canvas id="view"></canvas>
      <div id="fx" class="fx"></div>
      <div id="overlay"></div>
      <div id="hud"></div>
      <canvas id="minimap" width="150" height="150"></canvas>
      <div class="vignette"></div>
    </div>
    <div id="panel">
      <div id="log"></div>
      <div id="menu"></div>
    </div>
  </div>
  <div id="party"></div>
  <div id="bar">
    <div id="pad">
      <button data-k="a" title="Turn left (A)">⟲</button>
      <button data-k="w" title="Forward (W)">▲</button>
      <button data-k="d" title="Turn right (D)">⟳</button>
      <button data-k="s" title="Turn around (S)">▼</button>
    </div>
    <div class="keys"><b>WASD/Arrows</b> move &middot; <b>1-6</b> characters &middot; <b>C</b> cast &middot; <b>B</b> sing &middot; <b>U</b> use &middot; <b>M</b> map &middot; <b>Esc</b> menu &middot; <b>H</b> help</div>
    <div class="btns"><button id="btnMap" title="Map (M)">🗺</button><button id="btnMenu" title="Menu (Esc)">☰</button><button id="btnMute" title="Mute">🔊</button></div>
  </div>
</div>
<div id="transition"></div>
<div id="title"></div>
<div id="modal"></div>

<!-- Load order matters: core and data, then art and audio, then maps, state, textures, rendering,
     the interface, combat, the world, and the app last. Tests read this list (tests/load.js). -->
<!-- core & data -->
<script src="js/core/util.js"></script>

<script src="js/data/story.js"></script>
<script src="js/data/items.js"></script>

<script src="js/art/symbols.js"></script>
<script src="js/art/portraits.js"></script>
<script src="js/art/figures.js"></script>
<script src="js/art/keepsakes.js"></script>
<script src="js/art/npcs.js"></script>
<script src="js/art/monsters-beasts.js"></script>
<script src="js/art/monsters-undead.js"></script>

<script src="js/art/monsters-folded.js"></script>
<script src="js/art/scenes.js"></script>
<script src="js/art/api.js"></script>
<!-- audio (Web Audio) -->
<script src="js/audio/core.js"></script>

<script src="js/audio/tracks-ambient.js"></script>

</body>
</html>
